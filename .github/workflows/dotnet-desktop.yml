name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore CyberSafetyChatbot.sln

      - name: Build solution
        run: dotnet build CyberSafetyChatbot.sln --configuration Release --no-restore

      - name: Restore GUI project
        run: dotnet restore CyberSafetyChatbotGUI.csproj

      - name: Build GUI project
        run: dotnet build CyberSafetyChatbotGUI.csproj --configuration Release --no-restore
