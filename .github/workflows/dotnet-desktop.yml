name: .NET CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build projects or solutions
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path . -Filter *.csproj -Recurse -File -ErrorAction SilentlyContinue

          if ($projects) {
            foreach ($p in $projects) {
              Write-Host "Restoring and building project: $($p.FullName)"
              dotnet restore $p.FullName
              dotnet build $p.FullName --no-restore --configuration Release
            }
            exit 0
          }

          $solutions = Get-ChildItem -Path . -Filter *.sln -Recurse -File -ErrorAction SilentlyContinue
          if (-not $solutions) {
            Write-Error "No .csproj or .sln files found in the repository."
            exit 1
          }

          foreach ($s in $solutions) {
            Write-Host "Restoring and building solution: $($s.FullName)"
            dotnet restore $s.FullName
            dotnet build $s.FullName --no-restore --configuration Release
          }
